name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.author_association == 'CONTRIBUTOR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - run: |
          node --check index.js
          node --check subagent.js
          node --check router.js
      - run: npm test
